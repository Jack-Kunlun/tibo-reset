name: collect

# 构建网页 + 分发到两个方向。**CI 不采集数据。**
#
# 采集只有一处发起方：**本机**（WorkBuddy 自动化「Tibo Reset 采集（本机出口）」，
# 见 docs/data-source.md §5）。它走住宅出口，能过 Cloudflare —— x.com 的 Cloudflare
# 拦的是**机房 IP 段**，不是境外 IP。实测同一时刻：本机出口 200（213KB 完整页面，
# 4/4 稳定），runner 403 Cloudflare 挑战（x.com / twitter.com / mobile.twitter.com
# 三个域名一致）。
#
# 于是本工作流由两类事件触发，都不采数据：
#   1) push：本机采完把 data/ 推上来 —— 正常路径，构建 + 发布 + 推境内
#   2) workflow_dispatch：手动重跑（Pages 部署失败、改了页面想重发等）
#
# 曾有一条 `*/30` 的 schedule 充当「兜底采集」，2026-09-22 移除（decisions.md D-023）。
# 它的净产出是「每 30 分钟重新部署一次 Pages + 一次被服务端按 stale 忽略的 POST」，
# 数据与提交历史一个字都不动；而它唯一不可替代的职责 —— 发现「本机没在跑」——
# 改由页面自己承担：页面拿当前时间与 data/tweets.json 的 updated_at 相减，
# 超过两个采集周期就显示「数据未更新」（scripts/render.mjs 的 renderFreshness）。
# ⚠ 那个判据不依赖 CI 跑多勤，所以删掉定时器之后发现能力反而更及时（页面一被打开就在算）。
#
# 产物有两个去处（见 docs/tech-selection.md 3.6）：
#   1. 提交 data/ → 仓库留档；页面产物由 artifact 交给 Pages
#   2. POST 到境内服务的 /api/ingest → 小程序 API 的数据源
# 两路共用同一份数据与同一套模型代码，所以「页面数字 = API 数字」是架构保证，
# 不是靠人工比对（验收 A3）。
on:
  workflow_dispatch:          # 支持手动触发
  push:
    # 本机采完数据推上来时触发：直接建页面、发 Pages。
    # CI 自己用 GITHUB_TOKEN 推的提交不会触发新的运行，所以不存在循环。
    paths:
      - 'data/**'
      - 'miniprogram/data/**'
      - 'miniprogram/utils/scene.js'

permissions:
  contents: write             # 提交采集数据
  pages: write                # 发布 Pages
  id-token: write             # deploy-pages 需要

# 不让两轮并行：后一轮的产物会覆盖前一轮，且会抢同一个 git 引用
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # ---------------------------- 构建、留档 ----------------------------
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 构建期依赖只有这一个（@resvg/resvg-js，出 OG 分享图）。
      # 线上运行时依然零依赖：server/ 不 import 它。
      - name: 安装构建期依赖
        run: npm ci

      # ⚠ 必须装在构建之前。Ubuntu runner **默认不带中文字体**，
      #   缺字体时 resvg 不报错，只是把每个汉字画成一个空方框 ——
      #   静默产出一张坏掉的分享卡片。scripts/og-image.mjs 里做了前置探测
      #   （找不到字体就不出图），但正确做法是把字体装上，而不是让它降级。
      #
      # continue-on-error：字体只影响分享卡片这张图，不该有能力搞挂整条发布链。
      # apt 源抽风时让它跳过，构建会自动降级（不出 og:image），页面照常发布。
      - name: 安装中文字体
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # 校验在构建之前跑，顺序不能反：
      # test-shared 要检查 miniprogram/utils/scene.js 与 src/lib/scene.js 是否一致，
      # 放到构建之后的话副本刚被覆盖，那条检查恒真、等于没有。
      - name: 校验
        run: npm run test

      - name: 构建页面
        env:
          # og:url / og:image 要写成绝对地址，用对外分享的那个域名（境内镜像）。
          # 在仓库 Settings → Variables 配 SITE_URL；不配则构建会明确提示并跳过这两条 meta。
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build.mjs

      # A3：页面内联数字必须与 API 返回一致。放在构建之后 ——
      # 它比的是「刚构建出来的页面」与「现起的服务」，锚点贴近才能精确判等。
      - name: 校验页面与 API 一致
        run: node scripts/check-consistency.mjs

      # dist/ 不进版本管理（见 AGENTS.md）：页面产物走下面的 artifact。
      # 早先这里写的是 `git add data dist`，而 dist 被 .gitignore 排除，
      # 那一行会让整个步骤直接失败 —— 已修正。
      - name: 提交采集数据
        # 身份用**环境变量**传，不写 `git config`。
        # 那段 shell 曾被人在本机原样执行（排查问题用），后果是本仓库的 local 身份被改成
        # github-actions[bot]、提交作者写错 —— 2026-09-22 真实发生过一次。环境变量只作用于
        # 本 step 的 git 进程，谁在哪跑都改不到仓库配置，这个坑于是物理消失。
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          # 刻意不含 miniprogram/data：它是构建产物，且内嵌了构建时刻
          # （generatedAt / now，以及由 now 派生的全部预测值），于是**每次构建都不同**
          # —— 哪怕数据一个字都没动，也照样产生一次提交。它由本机在采集后构建并提交
          # （本机是主链路）；CI 这边只负责发布页面。
          #
          # ⚠ 提交判据是 scripts/data-changed.mjs，**不是** `git diff --staged --quiet`。
          #   后者是字节级判据，而 data/ 下有一批字段每轮必然不同、却与「数据有没有变」
          #   无关（stats.json 的 generated_at 与 stats.days_since_last、signal.json 的
          #   generatedAt 与时间窗边界）。字节级判据把它们当成变化，于是刷新一轮就提交
          #   一条 —— 而数据一个字都没动。翻统计：stats.json 的 20 次提交里 12 次是同一句
          #   「实时采集失败：HTTP 403」，看起来像采集一直在坏。
          #
          #   脚本退出码：0 = 有实质变化（提交）；1 = 只有时间戳在动（跳过）。
          #   脚本自己出错时返回 0 —— 漏提交等于数据丢档，宁可多提交一次。
          #   git add 的范围必须与脚本里的 DEFAULT_PATHS 一致。
          git add data miniprogram/utils/scene.js
          if node scripts/data-changed.mjs; then
            git commit -m "chore(data): 自动更新采集数据"
            git push
          else
            echo "只有时间戳字段在动，数据没有实质变化 → 跳过提交"
          fi

      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ------------------------------ 发布 Pages ------------------------------
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ------------------------- 推送到境内服务 -------------------------
  # 刻意独立成一个 job，而不是塞进 refresh：
  # 境内服务不可达时，页面该发的还是要发（数据已经在 refresh 里提交了），
  # 但这一步必须失败得明明白白 —— 否则就成了「页面是新的、API 是旧的」，
  # 而这种静默不一致正是本架构最想避免的情况。
  ingest:
    needs: refresh
    runs-on: ubuntu-latest
    steps:
      # refresh 已经 push 了最新数据，这里要拿的是那个提交而不是触发时的 SHA。
      # 若 refresh 无变化跳过提交，分支 HEAD 本身就是最新的，同样正确。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 推送到境内服务
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node scripts/push-ingest.mjs

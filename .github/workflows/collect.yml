name: collect

# 构建页面产物并发布。**本工作流不采集数据，也不推送数据。**
#
# 数据链完全在本机，一眼看完：
#   本机采集 → POST /api/ingest（后端立即生效，页面刷新即新）→ git push（留档）
#
# 网页本体由后端**请求时实时渲染**（server/index.mjs 调 src/lib/page.mjs，
# 与构建期同一套代码），所以本工作流的产物只剩两样，都不是「数据」：
#   1. GitHub Pages 上的静态页面 —— 异地备份入口（主入口是后端那个域名）
#   2. dist/og-image.png —— OG 分享图。**图片只能在构建期出**，接口改不了它，
#      所以它永远停在最后一次构建的数值，这是本架构已知且接受的代价
# 镜像也复用同一份 dist 作渲染失败时的兜底。
#
# 采集只有一处发起方：**本机**（WorkBuddy 自动化「Tibo Reset 采集（本机出口）」，
# 见 docs/data-source.md §5）。它走住宅出口，能过 Cloudflare —— x.com 的 Cloudflare
# 拦的是**机房 IP 段**，不是境外 IP。实测同一时刻：本机出口 200（213KB 完整页面，
# 4/4 稳定），runner 403 Cloudflare 挑战（x.com / twitter.com / mobile.twitter.com
# 三个域名一致）。
#
# 触发方式（都不涉及数据）：
#   1) push 代码 —— 改了 src/ scripts/ server/ miniprogram/ 才重建
#   2) workflow_dispatch —— 手动重跑（Pages 部署失败、想强制重发等）
#
# 两次「瘦身」，都记在 decisions.md：
#   · D-023（2026-09-22）：移除 `*/30` 的兜底采集。它的净产出是「每 30 分钟重新部署
#     一次 Pages + 一次被服务端按 stale 忽略的 POST」，数据一个字都不动；它唯一
#     不可替代的职责（发现「本机没在跑」）改由页面自己承担。
#   · D-025（2026-09-22）：移除 `push: paths: data/**` 与 ingest 转发。页面改为
#     请求时实时渲染之后，数据变化重建页面这件事就**没有任何产出**了 —— 页面本来
#     就是新的，重建只是烧 CI 分钟数；而推送数据也已由本机直连后端，不必绕一圈 CI。
#     ⚠ 下面 paths 里那两个 `!` 排除是这条决定的**必要条件**：本机采集后提交的
#       miniprogram/data/snapshot.js 与 miniprogram/utils/scene.js 都是构建产物，
#       不排除的话采集一次就触发一次重建，等于把 D-025 悄悄撤回。
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'server/**'
      - 'miniprogram/**'
      - '!miniprogram/data/**'          # 构建产物（本机采集后提交），非源码
      - '!miniprogram/utils/scene.js'   # 同上，由 build.mjs 从 src/lib/scene.js 同步
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/collect.yml'

permissions:
  contents: read              # 只读就够：本工作流不再提交任何东西
  pages: write                # 发布 Pages
  id-token: write             # deploy-pages 需要

# 不让两轮并行：后一轮的产物会覆盖前一轮
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # ---------------------------- 构建、留档 ----------------------------
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 构建期依赖只有这一个（@resvg/resvg-js，出 OG 分享图）。
      # 线上运行时依然零依赖：server/ 不 import 它。
      - name: 安装构建期依赖
        run: npm ci

      # ⚠ 必须装在构建之前。Ubuntu runner **默认不带中文字体**，
      #   缺字体时 resvg 不报错，只是把每个汉字画成一个空方框 ——
      #   静默产出一张坏掉的分享卡片。scripts/og-image.mjs 里做了前置探测
      #   （找不到字体就不出图），但正确做法是把字体装上，而不是让它降级。
      #
      # continue-on-error：字体只影响分享卡片这张图，不该有能力搞挂整条发布链。
      # apt 源抽风时让它跳过，构建会自动降级（不出 og:image），页面照常发布。
      - name: 安装中文字体
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # 校验在构建之前跑，顺序不能反：
      # test-shared 要检查 miniprogram/utils/scene.js 与 src/lib/scene.js 是否一致，
      # 放到构建之后的话副本刚被覆盖，那条检查恒真、等于没有。
      - name: 校验
        run: npm run test

      - name: 构建页面
        env:
          # og:url / og:image 要写成绝对地址，用对外访问的那个域名。
          # 在仓库 Settings → Variables 配 SITE_URL；不配则构建会明确提示并跳过这两条 meta。
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build.mjs

      # A3：页面内联数字必须与 API 返回一致。放在构建之后 ——
      # 它比的是「刚构建出来的页面」与「现起的服务」，锚点贴近才能精确判等。
      - name: 校验页面与 API 一致
        run: node scripts/check-consistency.mjs

      # dist/ 不进版本管理（见 AGENTS.md）：页面产物走下面的 artifact。
      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ------------------------------ 发布 Pages ------------------------------
  # 定位是**异地备份入口**，不是主入口。主入口是后端那个域名（自带最新数据）。
  # 保留它的理由：后端挂了 / 被墙了 / 域名出了问题时，还有一个能打开的页面。
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

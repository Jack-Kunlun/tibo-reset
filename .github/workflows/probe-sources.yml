name: probe-sources

# 数据源通道诊断。**只读、无副作用**：不写 data/、不提交、不发布。
#
# 为什么必须在 runner 上跑（本地跑没有意义）：
#   本地跑这些探针会**全部超时**，但原因不是「境内连不上 x.com」——
#   实测本机经代理直达 x.com 是 200（`curl -x http://127.0.0.1:7890 https://x.com/`），
#   采集（CDP + 真实 Chrome，跟系统代理）也一直在成功。超时是因为**探针用原生 fetch、
#   不走代理**（原生 fetch 也不认 HTTPS_PROXY，2026-09-22 实测）。所以本地探针只能
#   得出「探针自己出不去」这个无用结论，回答不了「通道本身能不能用」。
#   runner 能连上 x.com 但拿到 403 —— 两个环境的失败模式完全不同，
#   而「谁被 Cloudflare 挡了」才是决定要不要换通道的依据。
#
# 什么时候跑它：采集连续失败（页面上挂着「数据采集异常」横幅）时，
#   先跑这个探针，看是「全通道都挂」还是「主链路挂了但备链路还活着」。
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-sources.mjs'
      - 'scripts/probe-graphql.mjs'
      - 'scripts/probe-discovery.mjs'
      - 'scripts/probe-archive.mjs'
      - '.github/workflows/probe-sources.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 输出同时进日志和 step summary：日志便于逐步读，summary 便于直接看结论表。
      - name: 探测所有候选通道
        run: node scripts/probe-sources.mjs 2>&1 | tee probe-report.txt

      # 阶段二：验证 guest token + GraphQL 能否端到端取到推文正文。
      # continue-on-error：两段探针互相独立，一段挂掉不该让另一段的结论消失。
      - name: 验证 GraphQL 链路
        continue-on-error: true
        run: node scripts/probe-graphql.mjs 2>&1 | tee graphql-report.txt

      # 阶段三：验证「从站点 HTML 动态发现 bearer / queryId」。
      # 它同时回答一个前提问题：twitter.com 的 CF 策略是否比 x.com 宽松。
      - name: 动态发现 queryId
        continue-on-error: true
        run: node scripts/probe-discovery.mjs 2>&1 | tee discovery-report.txt

      # 阶段四：站点源码改从 archive.org 取（绕开 CF），并诊断 guest token 的 401。
      - name: archive 通道与 guest token 诊断
        continue-on-error: true
        run: node scripts/probe-archive.mjs 2>&1 | tee archive-report.txt

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo '## 阶段一：通道矩阵'
            echo ''
            echo '```'
            tail -n 45 probe-report.txt 2>/dev/null || echo '（无输出）'
            echo '```'
            echo ''
            echo '## 阶段二：GraphQL 链路'
            echo ''
            echo '```'
            cat graphql-report.txt 2>/dev/null || echo '（无输出）'
            echo '```'
            echo ''
            echo '## 阶段三：queryId 动态发现'
            echo ''
            echo '```'
            cat discovery-report.txt 2>/dev/null || echo '（无输出）'
            echo '```'
            echo ''
            echo '## 阶段四：archive 通道'
            echo ''
            echo '```'
            cat archive-report.txt 2>/dev/null || echo '（无输出）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

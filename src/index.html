<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>等 TIBO 按按钮 · 额度重置观测台</title>
<meta name="description" content="Codex 额度重置的观测台：距上次重置多久、还要等多久、以及 Tibo 有没有提前预告。" />
<!-- 图标走独立文件、不用 data URI 内联：浏览器抓 favicon 的时机早于页面渲染，
     且 Safari 对 data: 图标的支持长期不稳定。两个 png 由 scripts/build.mjs 拷进 dist/。 -->
<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
<meta name="theme-color" content="#f5f4fb" />
<!--__OG_META__-->
<style>

  #observatory{--am-accent:#6150d4;--am-ink:#292741;--am-muted:#73708a;--am-line:#e6e2f1;--am-glow:.8;--am-speed:1;position:relative;isolation:isolate;box-sizing:border-box;padding:0 34px 28px;background:#f5f4fb;color:var(--am-ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow-wrap:break-word}
  #observatory *{box-sizing:border-box}
  #observatory h1,#observatory h2,#observatory p{margin:0}
  #observatory a{color:inherit;text-decoration:none}
  #observatory a:hover{text-decoration:underline;text-underline-offset:4px}
  #observatory .am-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
  #observatory .am-small{font-size:12px}
  #observatory .am-tiny{font-size:11px}
  #observatory .am-muted{color:var(--am-muted)}
  #observatory .am-sky{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;opacity:var(--am-glow)}
  #observatory .am-cloud{position:absolute;filter:blur(38px);border-radius:50%;will-change:transform}
  #observatory .am-cloud-mint{width:74%;height:570px;left:-26%;top:-130px;background:radial-gradient(ellipse,#b8e6db 0,#d8f1eb 35%,transparent 70%)}
  #observatory .am-cloud-violet{width:90%;height:700px;right:-30%;top:-80px;background:radial-gradient(ellipse,#cdb9ef 0,#e0d7f8 40%,transparent 72%)}
  #observatory .am-cloud-blue{width:90%;height:600px;left:8%;top:390px;background:radial-gradient(ellipse,#c3d9f5 0,#e8e5fa 40%,transparent 74%)}
  #observatory .am-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:25px 0 22px;border-bottom:1px solid #dddbea}
  #observatory .am-brand{display:flex;align-items:center;gap:11px;min-width:0}
  #observatory .am-logo{width:38px;height:38px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(140deg,#8173cf,#493b84);border:1px solid #9383d2;border-radius:12px;box-shadow:0 6px 15px #53459126,inset 0 1px 0 #ffffff6b}
  #observatory .am-logo svg{width:20px;height:20px}
  #observatory .am-brand b{font-size:17px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
  #observatory .am-brand .am-tiny{letter-spacing:.13em;color:var(--am-muted)}
  #observatory .am-tools{display:flex;align-items:center;gap:12px;font-size:12px}
  #observatory .am-pause{font:inherit;color:var(--am-muted);border:1px solid var(--am-line);padding:6px 11px;background:#fff;border-radius:99px;box-shadow:0 2px 4px #5848aa06}
  #observatory .am-live{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid #e1d9f4;border-radius:99px;background:#fff;color:var(--am-accent);white-space:nowrap}
  #observatory .am-dot{width:6px;height:6px;border-radius:50%;background:var(--am-accent);box-shadow:0 0 0 4px #eae5fa;display:inline-block;flex:none}
  #observatory .am-context{display:flex;justify-content:space-between;gap:8px 18px;align-items:center;flex-wrap:wrap;padding:17px 2px;color:var(--am-muted);font-size:12px}
  #observatory .am-context b{font-weight:500;color:var(--am-ink);margin-left:10px}
  #observatory .pred{perspective:1200px;position:relative}
  #observatory .pcard{--am-mx:50%;--am-my:35%;position:relative;isolation:isolate;border-radius:27px;background:linear-gradient(130deg,#fff 0%,#f6f3ff 47%,#f0fbf8 100%);border:1px solid #fff;padding:24px 27px 0;box-shadow:0 2px 3px #6150ac06,0 23px 50px -26px #7666b76b,inset 0 0 0 1px #e5ddf3;transform:rotateX(var(--am-rx,0deg)) rotateY(var(--am-ry,0deg));transition:transform .25s ease-out,box-shadow .3s;transform-style:preserve-3d}
  #observatory .pcard:before{content:"";position:absolute;inset:1px;border-radius:inherit;z-index:-1;background:radial-gradient(370px circle at var(--am-mx) var(--am-my),#fff9 0,#dcd0fb45 30%,transparent 70%);pointer-events:none}
  #observatory .pcard-top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}
  #observatory .am-kicker{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.15em;color:var(--am-accent);font-weight:500}
  #observatory .am-kicker:before{content:"";width:14px;height:2px;background:var(--am-accent)}
  #observatory .pc-conf{display:inline-flex;gap:7px;align-items:center;border-radius:99px;padding:5px 11px;background:#eeebfb;color:var(--am-accent);font-size:12px;white-space:nowrap}
  #observatory .pc-conf svg{width:13px;height:13px}
  #observatory .am-stage{position:relative;isolation:isolate;display:flex;align-items:center;flex-direction:column;justify-content:center;text-align:center;padding:29px 6px 25px;min-height:312px}
  #observatory .am-stage h2{font-size:18px;font-weight:500;letter-spacing:.01em;position:relative;z-index:1}
  #observatory .am-orbit-field{position:absolute;inset:-25px -27px -5px;overflow:hidden;pointer-events:none;z-index:-1}
  #observatory .am-orbit-plane{position:absolute;width:550px;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-19deg) scaleY(.43);opacity:.76}
  #observatory .am-orbit-plane.am-inner{width:370px;transform:translate(-50%,-50%) rotate(24deg) scaleY(.52);opacity:.65}
  #observatory .am-orbit-plane.am-outer{width:710px;transform:translate(-50%,-50%) rotate(-19deg) scaleY(.43);opacity:.34}
  #observatory .am-orbit-ring{position:absolute;inset:0;border-radius:50%;border:1px solid #b5a5d7}
  #observatory .am-orbit-spin{position:absolute;inset:0;border-radius:50%}
  #observatory .am-orbit-spin:before{content:"";position:absolute;width:8px;height:8px;left:calc(50% - 4px);top:-4px;border-radius:50%;background:#9c7be2;box-shadow:0 0 0 5px #c1ace724,0 0 22px 6px #b8a0f2;transform:scaleY(2)}
  #observatory .am-inner .am-orbit-spin:before{background:#66bba9;box-shadow:0 0 0 5px #8cdbc52b,0 0 25px 7px #91d6c6}
  #observatory .am-stage-glow{position:absolute;width:310px;height:145px;left:calc(50% - 155px);top:41%;border-radius:50%;background:radial-gradient(ellipse,#b9e7dc90,transparent 70%);filter:blur(20px);z-index:-1}
  #observatory .am-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#a995d3;box-shadow:0 0 9px #b6a7e5;opacity:.65}
  #observatory .am-star:nth-of-type(1){left:15%;top:24%}
  #observatory .am-star:nth-of-type(2){left:82%;top:32%;background:#78b8aa}
  #observatory .am-star:nth-of-type(3){left:24%;top:72%}
  #observatory .am-star:nth-of-type(4){left:73%;top:78%}
  #observatory .am-date{display:flex;align-items:center;justify-content:center;margin:9px 0 1px;font-size:105px;line-height:1.15;letter-spacing:-.065em;font-weight:500;perspective:600px;position:relative;z-index:1}
  #observatory .am-digit-cell{display:inline-block;overflow:hidden;perspective:500px;padding:0 .015em;margin:0 -.015em}
  #observatory .am-digit{display:block;transform-origin:center bottom;background:linear-gradient(135deg,#33345e 8%,var(--am-accent) 63%,#438d87 100%);background-clip:text;-webkit-background-clip:text;color:transparent}
  #observatory .am-date .am-dot-digit{width:.37em;letter-spacing:0}
  #observatory .am-stage .am-small{position:relative;z-index:1;color:var(--am-muted)}
  #observatory .pc-wait{display:flex;gap:15px;align-items:baseline;justify-content:center;flex-wrap:wrap;margin-top:19px;color:var(--am-muted);font-size:12px;position:relative;z-index:1}
  #observatory .pc-wait strong{font-size:27px;font-weight:500;letter-spacing:-.045em;color:var(--am-ink)}
  #observatory .pc-band{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 16px;border-top:1px solid #e2dff0;padding:15px 0;font-size:12px;position:relative;z-index:1}
  #observatory .pc-band b{font-weight:500;margin-left:12px;color:var(--am-ink)}
  #observatory .am-signal{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:7px 15px;background:#fafaff;border:1px solid #e0d9f0;border-radius:14px;padding:14px 18px;margin-top:15px;font-size:12px}
  #observatory .am-signal>span:first-child{display:flex;align-items:center;gap:9px}
  #observatory .am-signal svg{width:15px;height:15px;color:var(--am-accent)}
  #observatory .am-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:17px;margin-top:20px;align-items:stretch}
  #observatory .am-panel{position:relative;border:1px solid #e3ddef;border-radius:18px;padding:20px;background:#fff;box-shadow:0 3px 14px -12px #6b5ba83d;min-width:0;transition:transform .25s,box-shadow .25s,border-color .25s}
  #observatory .am-panel h2{font-size:14px;font-weight:600}
  #observatory .am-panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:9px;flex-wrap:wrap}
  #observatory .am-chart{display:block;width:100%;height:196px;margin-top:12px}
  #observatory .am-side{display:flex;flex-direction:column;gap:16px;min-width:0}
  #observatory .sig-prog{padding:16px 18px}
  #observatory .sig-prog summary{display:flex;gap:11px;align-items:center;list-style:none;font-size:13px}
  #observatory summary::-webkit-details-marker{display:none}
  #observatory .sig-prog summary:after{content:"＋";font-size:17px;color:var(--am-muted);margin-left:auto}
  #observatory .sig-prog[open] summary:after{content:"−"}
  #observatory .am-icon{height:31px;width:31px;display:grid;place-items:center;flex:none;color:var(--am-accent);background:#eeebfb;border-radius:9px}
  #observatory .am-icon svg{width:15px;height:15px}
  #observatory .sig-prog-note{margin-top:8px!important;padding-left:42px;color:var(--am-muted);font-size:11px}
  #observatory .am-detail{padding-top:13px;color:var(--am-muted);font-size:12px}
  #observatory .am-detail p+p{margin-top:7px}
  #observatory .am-basis{flex:1;padding-top:17px;padding-bottom:12px}
  #observatory .am-basis h2{margin-bottom:5px}
  #observatory .am-basis-row{display:flex;align-items:baseline;justify-content:space-between;gap:13px;padding:11px 0;border-top:1px solid var(--am-line);font-size:12px}
  #observatory .am-basis-row:first-of-type{border-top:0}
  #observatory .am-basis-row strong{font-size:21px;font-weight:500;letter-spacing:-.045em;white-space:nowrap}
  #observatory .am-basis-row strong small{font-size:11px;font-weight:400;letter-spacing:0;margin-left:3px}
  /* 依据的边界披露：必须**可见**。刻意不加边框 —— 上面 `.am-basis-row` 自带 1px 上边框，
     这里再加一条就会与它凑成「相邻两个有边框的块」，被 A7b 判成贴线（见 check-layout.mjs）。 */
  #observatory .am-basis-note{margin-top:12px;color:var(--am-muted);font-size:11px}
  #observatory .am-disclosure{font-size:12px;color:var(--am-muted);margin-top:14px}
  #observatory .am-disclosure summary{list-style:none;display:flex;align-items:center;gap:7px}
  #observatory .am-disclosure summary:after{content:"↗";color:var(--am-accent)}
  #observatory .am-records{margin-top:18px}
  #observatory .am-record-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px;margin-top:15px}
  #observatory .am-record{min-width:0;display:block;font-size:12px}
  #observatory .am-record+.am-record{border-left:1px solid var(--am-line);padding-left:23px}
  #observatory .am-record-top{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--am-muted)}
  #observatory .am-record p{margin-top:6px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
  #observatory .am-footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;margin-top:25px;padding-top:20px;border-top:1px solid #dedbe9;color:var(--am-muted);font-size:11px}
  #observatory .am-ripple-field{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:0}
  #observatory .am-tap-ring{position:absolute;border:1px solid #9f86d13d;box-shadow:0 0 35px #b69de923;border-radius:50%;height:230px;width:230px;margin:-115px 0 0 -115px;pointer-events:none;z-index:0;animation:am-tap .85s ease-out forwards}
  @keyframes am-mint{0%{transform:translate3d(0,0,0) rotate(-10deg) scale(1)}50%{transform:translate3d(18%,13%,0) rotate(5deg) scale(1.15)}100%{transform:translate3d(2%,25%,0) rotate(-8deg) scale(1.05)}}
  @keyframes am-violet{0%{transform:translate3d(0,0,0) rotate(8deg) scale(1.1)}50%{transform:translate3d(-18%,22%,0) rotate(-8deg) scale(1)}100%{transform:translate3d(-4%,-5%,0) rotate(3deg) scale(1.12)}}
  @keyframes am-blue{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-8%,-18%,0) scale(1.15)}100%{transform:translate3d(9%,4%,0) scale(.95)}}
  @keyframes am-orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes am-flip{from{transform:translateY(.82em) rotateX(-75deg);filter:blur(4px)}to{transform:translateY(0) rotateX(0);filter:blur(0)}}
  @keyframes am-tap{from{transform:scale(.25);opacity:.65}to{transform:scale(1.7);opacity:0}}
  @media(prefers-reduced-motion:no-preference){
    #observatory .am-cloud-mint{animation:am-mint calc(22s / var(--am-speed)) ease-in-out infinite alternate}
    #observatory .am-cloud-violet{animation:am-violet calc(26s / var(--am-speed)) ease-in-out infinite alternate}
    #observatory .am-cloud-blue{animation:am-blue calc(31s / var(--am-speed)) ease-in-out infinite alternate}
    #observatory .am-orbit-spin{animation:am-orbit calc(27s / var(--am-speed)) linear infinite}
    #observatory .am-inner .am-orbit-spin{animation-duration:calc(18s / var(--am-speed));animation-direction:reverse}
    #observatory .am-outer .am-orbit-spin{animation-duration:calc(42s / var(--am-speed));animation-direction:reverse}
    #observatory:not([data-entered="true"]) .am-digit{animation:am-flip .9s cubic-bezier(.16,.8,.25,1) both;animation-delay:calc(var(--am-index) * 85ms)}
  }
  #observatory[data-running="false"] .am-cloud,#observatory[data-running="false"] .am-orbit-spin,#observatory[data-visible="false"] .am-cloud,#observatory[data-visible="false"] .am-orbit-spin{animation-play-state:paused}
  #observatory[data-running="false"] .am-digit{animation:none;filter:none;transform:none}
  #observatory[data-running="false"] .am-tap-ring{display:none}
  @media(hover:hover) and (prefers-reduced-motion:no-preference){
    #observatory[data-running="true"] .am-panel:hover{transform:translateY(-3px);border-color:#cbbce8;box-shadow:0 13px 25px -19px #7964a95c}
    #observatory .am-pause:hover{color:var(--am-accent);border-color:#c7bae9}
  }
  @media(prefers-reduced-motion:reduce){
    #observatory *,#observatory *:before,#observatory *:after{animation:none!important;transition:none!important}
    #observatory .pcard{transform:none!important}
  }
  @media(max-width:700px){
    #observatory{padding:0 20px 24px}
    #observatory .am-header{gap:10px;padding:21px 0 18px}
    #observatory .am-brand{gap:9px}
    #observatory .am-brand b{font-size:14px}
    #observatory .am-brand .am-tiny{display:none}
    #observatory .am-logo{width:31px;height:31px;border-radius:10px}
    #observatory .am-tools{gap:7px;font-size:11px}
    #observatory .am-pause{padding:6px 9px}
    #observatory .am-live{display:none}
    #observatory .am-context{font-size:11px;padding:15px 0;gap:4px}
    #observatory .am-context b{margin-left:5px}
    #observatory .am-context>span:last-child{width:100%}
    #observatory .pcard{padding:21px 19px 0;border-radius:23px}
    #observatory .am-kicker{letter-spacing:.05em}
    #observatory .pc-conf{font-size:11px;padding:4px 8px}
    #observatory .pc-conf svg{display:none}
    #observatory .am-stage{min-height:298px;padding:26px 0}
    #observatory .am-stage h2{font-size:16px}
    #observatory .am-date{font-size:83px;margin-top:12px}
    #observatory .am-stage>.am-small{font-size:11px}
    #observatory .pc-wait{gap:8px;font-size:11px;margin-top:22px}
    #observatory .pc-wait strong{font-size:24px}
    #observatory .am-orbit-plane{width:390px}
    #observatory .am-orbit-plane.am-inner{width:270px}
    #observatory .am-orbit-plane.am-outer{width:530px}
    #observatory .pc-band{font-size:11px;padding:13px 0}
    #observatory .pc-band b{margin-left:0;display:block;margin-top:3px}
    #observatory .pc-band>span:last-child{display:none}
    #observatory .am-signal{padding:13px 14px;font-size:11px;gap:4px}
    #observatory .am-main{grid-template-columns:1fr;gap:15px;margin-top:17px}
    #observatory .am-side{order:1;gap:14px}
    #observatory .am-history{order:2}
    #observatory .am-panel{padding:17px 16px}
    #observatory .am-record-grid{grid-template-columns:1fr;gap:13px;margin-top:14px}
    #observatory .am-record+.am-record{border-left:0;border-top:1px solid var(--am-line);padding-left:0;padding-top:13px}
    #observatory .am-cloud{filter:blur(25px)}
    #observatory .am-footer{gap:5px}
  }
  @media(max-width:370px){
    #observatory{padding-left:16px;padding-right:16px}
    #observatory .am-brand b{font-size:13px}
    #observatory .am-tools{font-size:11px}
    #observatory .am-pause{padding-left:8px;padding-right:8px}
    #observatory .pcard{padding-left:16px;padding-right:16px}
    #observatory .am-date{font-size:73px}
    #observatory .pcard-top{gap:8px}
  }
  @media(pointer:coarse){
    #observatory .am-pause{min-height:44px}
    #observatory summary{min-height:44px}
  }

  :root{--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--ink:#292741;--ink2:#56516e;--mist:#73708a;--line:#e6e2f1;--card:#fff;--paper2:#f5f3fb;--lan:#6150d4;--bamboo:#438d87;--cinnabar:#a14b45;--amber:#8a672a}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:#f5f4fb}
  body{margin:0;background:#f5f4fb}
  button,summary,a{-webkit-tap-highlight-color:transparent}
  button,summary{cursor:pointer}button:disabled{cursor:default}
  [hidden]{display:none!important}
  #observatory.wrap{max-width:1024px;margin:0 auto;min-height:100vh}
  #observatory .am-brand h1{font-size:17px;font-weight:600;letter-spacing:-.03em;margin:0;white-space:nowrap}
  #observatory .pulse #upd{font-variant-numeric:tabular-nums}
  #observatory .pulse{font-family:var(--sans)}
  #observatory .am-context{margin:0}
  #observatory .am-context-left{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  #observatory .hero-v{display:inline-flex;align-items:baseline;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--am-ink);font-weight:500;line-height:1;gap:5px}
  #observatory .grp,#observatory .reels{display:inline-flex;align-items:baseline}
  #observatory .reel{display:inline-block;width:.62em;height:1em;overflow:hidden;vertical-align:baseline}
  #observatory .reel .strip{display:block;transition:transform .55s cubic-bezier(.18,.86,.24,1)}
  #observatory .reel .strip i{display:block;height:1em;line-height:1;font-style:normal;text-align:center}
  #observatory .unit{font-size:1em;margin-left:4px;font-weight:400}
  #observatory .pred{margin:0}
  #observatory .pc-conf{display:inline-flex;align-items:center;gap:7px}
  #observatory .pc-conf[data-level="low"]{color:#8a672a;background:#f7efdf}
  #observatory .pc-conf[data-level="high"]{color:#328775;background:#e5f4ee}
  #observatory .am-stage h2{font-size:18px;font-weight:500;position:relative;z-index:1}
  #observatory .pc-eta{position:relative;z-index:1}
  #observatory .pc-wait{display:flex;align-items:baseline;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:19px;color:var(--am-muted);font-size:12px;position:relative;z-index:1}
  #observatory .counter{font-family:var(--mono);font-size:27px;font-weight:500;letter-spacing:-.045em;color:var(--am-ink);line-height:1;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;justify-content:center}

<div id="observatory" class="wrap" data-running="false" data-visible="true" data-entered="true">

<script type="application/json" id="data-digest"><!--__DIGEST__--></script>
<script>
(function () {
  var DAY = 86400000;
  var REEL = '';
  for (var d = 0; d < 10; d++) REEL += '<i>' + d + '</i>';
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  // ① 大倒计时：**距预测重置时刻**。带推断那一块（预测总览）的核心数字。
  //    锚点、初始值都在构建期写死（`.pm` 的 data-eta / .grp 的 translateY），
  //    脚本被禁用时数字依然正确，只是不再滚动。
  var pred = document.getElementById('pred');
  var pcd = document.getElementById('pcd');
  var pcdCap = document.getElementById('pcd-cap');
  var pcdWait = pred ? pred.querySelector('.pc-wait') : null;
  var pcdGroups = pcd ? pcd.querySelectorAll('.grp') : null;
  var etaFrom = pred && pred.dataset.eta ? Number(pred.dataset.eta) : NaN;
  var pcdOk = isFinite(etaFrom) && pcdGroups && pcdGroups.length === 4;

  // ② 「已经等了多久」那个大数字 —— 它是页面上的**第一块**（排在预测总览之前）。
  //    锚点取自**它自己的** data-last，不取主卡的 —— 主卡在没有可用预测时
  //    整块不出现，而这一块仍然在。挂在主卡上会让它跟着冻住，页面上就出现
  //    一个不走的钟，而那正是「静默陈旧」最典型的形态。
  //    形态与①一样是**四位卷轴**（天/时/分/秒），初始位置由服务端写死在行内样式里。
  //    这四个 `.grp` 没有就走「只渲染不动」：判据是**找得到 4 组**，不是「元素在」——
  //    后者在模板被改回纯文本时会静默成立，然后每秒对着一串文字调 setGroup。
  var el = document.getElementById('elapsed');
  var elGroups = el ? el.querySelectorAll('.grp') : null;
  var last = el && el.dataset.last ? new Date(el.dataset.last).getTime() : NaN;
  var sinceOk = isFinite(last) && !!elGroups && elGroups.length === 4;

  // ③ 距公告窗口开启（信号卡内，**只在有预告时出现**）。第三个锚点，
  //    与上面那条不是一回事：这条数的是「他说的那个窗口什么时候开」。
  //    不写成独立的 IIFE：用一个 `if (pred) return` 开头的老写法，会让
  //    首屏一旦缺元素就连带把这块也关掉，几块倒计时不该互相牵连。
  var cds = [];
  var cdNodes = document.querySelectorAll('.sig-cd');
  for (var n = 0; n < cdNodes.length; n++) {
    var row = cdNodes[n].querySelector('.cd-row');
    var from = Number(cdNodes[n].dataset.from);
    if (!row || !isFinite(from)) continue;
    cds.push({ el: cdNodes[n], row: row, from: from, groups: row.querySelectorAll('.grp') });
  }

  // ④ 右上角「观测中 · HH:MM:SS」—— 显示**当前北京时间**，跟着真实时钟走。
  //    必须显式指定时区：浏览器可能在任何时区，读本机时钟会显示错的时间。
  //    不取数据采集时刻：那是「数据多新」，页脚已写着「最近一次采集 ⋯」，
  //    放这里既是重复，又因为「观测中」是现在进行时，会被读成「现在几点」——
  //    看到两小时前的数字就以为页面停更了。
  var upd = document.getElementById('upd');
  var bjClock = null;
  if (upd && typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
    try {
      bjClock = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Shanghai',
        hourCycle: 'h23',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
    } catch (e) {
      // 极老的运行时可能不认 timeZone。宁可保留静态兜底值，也不显示错的时间。
      bjClock = null;
    }
  }

  // ⑤ 数据陈旧：数据超过两个采集周期没有**成功**更新时，把这件事说出来。
  //    容器由服务端渲染（承载 data-at / data-stale-after），未超阈值时带 hidden，
  //    构建那一刻就已陈旧的话服务端连 hidden 都不给 —— 脚本被禁用也看得见。
  //    这里只负责两件事：后来才超阈值时去掉 hidden、把「距今多久」填上。
  //    ⚠ 它与「数据采集异常」横幅**互斥**：errors 非空时服务端根本不输出这个容器，
  //    所以找不到元素就什么都不做，而不是自己再造一条相似提示。
  var cstale = document.getElementById('cstale');
  var cstaleAge = document.getElementById('cstale-age');
  var freshAt = cstale && cstale.dataset.at ? Date.parse(cstale.dataset.at) : NaN;
  var staleAfterMs = cstale ? Number(cstale.dataset.staleAfter) * 60000 : NaN;
  var freshOk = isFinite(freshAt) && isFinite(staleAfterMs) && staleAfterMs > 0;

  // 距今多久。数据已经陈旧到这个程度，小时比分钟更有信息量；过了一天就换成天。
  function fmtAge(ms) {
    var h = ms / 3600000;
    return h < 24 ? h.toFixed(1) + ' 小时' : (h / 24).toFixed(1) + ' 天';
  }

  function setGroup(grp, str) {
    var box = grp.querySelector('.reels');
    if (!box) return;
    var reels = box.children;

    // 位数变了（基本只可能是「天」从 9 变 10）：重建，且不做过渡，
    // 否则新卷轴会从 0 滚到目标位，看起来像发生了一次重置。
    if (reels.length !== str.length) {
      var html = '';
      for (var i = 0; i < str.length; i++) {
        html += '<span class="reel"><span class="strip">' + REEL + '</span></span>';
      }
      box.innerHTML = html;
      reels = box.children;
      for (var j = 0; j < reels.length; j++) {
        var st = reels[j].firstElementChild;
        st.style.transition = 'none';
        st.style.transform = 'translateY(-' + str[j] + 'em)';
      }
      void box.offsetWidth;
      for (var k = 0; k < reels.length; k++) reels[k].firstElementChild.style.transition = '';
    }

    for (var m = 0; m < reels.length; m++) {
      var strip = reels[m].firstElementChild;
      if (!strip) continue;
      var want = 'translateY(-' + str[m] + 'em)';
      if (strip.style.transform !== want) strip.style.transform = want;
    }
  }

  function parts(ms) {
    return {
      d: Math.floor(ms / DAY),
      h: Math.floor((ms % DAY) / 3600000),
      m: Math.floor((ms % 3600000) / 60000),
      s: Math.floor((ms % 60000) / 1000),
    };
  }

  function tick() {
    var now = Date.now();

    // ④ 当前北京时间。与三块倒数共用同一次 tick，不额外开定时器。
    if (bjClock) upd.textContent = bjClock.format(now);

    // ⑤ 数据陈旧。年龄是分钟级变化，但仍然挂在同一次 tick 上，不另开定时器。
    if (freshOk) {
      var age = now - freshAt;
      if (age > staleAfterMs) {
        if (cstale.hidden) cstale.hidden = false;
        if (cstaleAge) cstaleAge.textContent = '，距今 ' + fmtAge(age);
      }
    }

    // ① 距预测重置时刻。过了那个时刻就换成一句话，而不是继续数负数 ——
    //    中位数到了不代表不会重置，只代表「一半的样本比这更快」，
    //    所以那句话说的是「随时可能」+「区间仍有效」，不是一个假承诺。
    if (pcdOk) {
      var left = etaFrom - now;
      var over = left <= 0;
      if (pcdWait && pcdWait.dataset.over !== (over ? '1' : '0')) {
        pcdWait.dataset.over = over ? '1' : '0';
        if (pcdCap) pcdCap.textContent = over ? '已到预测时刻' : '预计还需等待';
      }
      if (!over) {
        var q = parts(left);
        pcd.dataset.scale = q.d > 0 ? 'd' : q.h > 0 ? 'h' : q.m > 0 ? 'm' : 's';
        pcd.setAttribute('aria-label', q.d + ' 天 ' + q.h + ' 小时 ' + q.m + ' 分 ' + q.s + ' 秒');
        setGroup(pcdGroups[0], String(q.d));
        setGroup(pcdGroups[1], pad(q.h));
        setGroup(pcdGroups[2], pad(q.m));
        setGroup(pcdGroups[3], pad(q.s));
      }
    }

    // ② 「已经等了多久」。与①同一套卷轴位、同一套拆法（都先把总秒 **round** 一次
    //    再拆）。口径必须与 `render.mjs` 的 `spanOf` 同一个表达式 —— 静态值与
    //    这里各写一套的话，脚本一接管数字就会换副面孔；而差一秒的那种写法，
    //    会在 23:59:59.6 这类临界点上让页首与「历史规律」那道「现在 X」标签
    //    各说各话。
    if (sinceOk) {
      var sinceMs = now - last;
      if (sinceMs >= 0) {
        var t = Math.round(sinceMs / 1000);
        el.setAttribute('aria-label', Math.floor(t / 86400) + ' 天 ' + Math.floor((t % 86400) / 3600) + ' 时 ' + Math.floor((t % 3600) / 60) + ' 分 ' + (t % 60) + ' 秒');
        setGroup(elGroups[0], String(Math.floor(t / 86400)));
        setGroup(elGroups[1], pad(Math.floor((t % 86400) / 3600)));
        setGroup(elGroups[2], pad(Math.floor((t % 3600) / 60)));
        setGroup(elGroups[3], pad(t % 60));
      }
    }

    for (var i = 0; i < cds.length; i++) {
      var c = cds[i];
      var left = c.from - now;
      // 窗口开了就换成一行文字。继续数「负数」只会变成没有意义的读数；
      // 而「已开启」这件事本身是有信息量的：重置随时可能落地。
      if (left <= 0) {
        if (c.el.dataset.over !== '1') c.el.dataset.over = '1';
        continue;
      }
      if (c.el.dataset.over !== '0') c.el.dataset.over = '0';
      if (c.groups.length !== 4) continue;
      var q = parts(left);
      setGroup(c.groups[0], String(q.d));
      setGroup(c.groups[1], pad(q.h));
      setGroup(c.groups[2], pad(q.m));
      setGroup(c.groups[3], pad(q.s));
    }
  }

  tick();
  setInterval(tick, 1000);
})();

/* 窄屏默认收起「依据 N 条推文」。
   证据挂在这条预告里面是个**结构**问题，跟屏宽无关；能不能一眼看到 4 条是
   排版问题 —— 窄屏单列铺开 4 条会把倒计时顶出第一屏（实测 390×844 下预告卡
   高 1152px，倒计时落到 1238px）。所以窄屏折一下：摘要行「依据 4 条推文 ·
   2 条承诺 · 2 条同日提及」照常可见，归属关系不丢，详情点一下。
   ⚠ 这里只负责窄屏收起，**不负责展开** —— HTML 里本来就带 open，
      脚本被禁用/报错时页面退化成「全部展开」，内容一条都不会少。 */
(function () {
  var boxes = document.querySelectorAll('details.sig-ev');
  if (!boxes.length) return;
  var mq = window.matchMedia('(max-width: 759px)');

  function sync() {
    for (var i = 0; i < boxes.length; i++) {
      if (boxes[i].dataset.kept) continue; // 用户自己动过，就不跟屏宽抢了
      boxes[i].open = !mq.matches;
    }
  }

  for (var i = 0; i < boxes.length; i++) {
    var sum = boxes[i].querySelector('summary');
    if (sum) sum.addEventListener('click', function () { this.parentNode.dataset.kept = '1'; });
  }

  sync();
  if (mq.addEventListener) mq.addEventListener('change', sync);
  else if (mq.addListener) mq.addListener(sync);
})();
</script>
<script>
(function () {
  var root = document.getElementById('observatory');
  var button = document.getElementById('motion-toggle');
  var hero = document.getElementById('pred');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  var playing = true;
  var frame = 0;
  var intersecting = true;
  try { playing = localStorage.getItem('reset-observatory-motion') !== 'off'; } catch (e) {}
  function clearPointer() {
    cancelAnimationFrame(frame);
    if (!hero) return;
    ['--am-rx','--am-ry','--am-mx','--am-my'].forEach(function (key) { hero.style.removeProperty(key); });
  }
  function renderMotion() {
    var enabled = playing && !reduced.matches;
    root.dataset.running = String(enabled);
    button.textContent = reduced.matches ? '已减少动效' : enabled ? '暂停动效' : '启用动效';
    button.disabled = reduced.matches;
    button.setAttribute('aria-pressed', String(!enabled));
    if (!enabled) clearPointer();
  }
  button.addEventListener('click', function () {
    playing = !playing;
    try { localStorage.setItem('reset-observatory-motion', playing ? 'on' : 'off'); } catch (e) {}
    renderMotion();
  });
  button.hidden = false;
  if (reduced.addEventListener) reduced.addEventListener('change', renderMotion);
  else if (reduced.addListener) reduced.addListener(renderMotion);
  renderMotion();
  if (playing && !reduced.matches) {
    root.dataset.entered = 'false';
    setTimeout(function () { root.dataset.entered = 'true'; }, 1500);
  }
  function visibility() { root.dataset.visible = String(intersecting && !document.hidden); }
  document.addEventListener('visibilitychange', visibility);
  if (hero && 'IntersectionObserver' in window) new IntersectionObserver(function (entries) {
    intersecting = entries[0].isIntersecting;
    visibility();
  }).observe(hero);
  visibility();
  if (!hero) return;
  hero.addEventListener('pointermove', function (event) {
    if (!playing || reduced.matches || event.pointerType === 'touch') return;
    cancelAnimationFrame(frame);
    var r = hero.getBoundingClientRect();
    var px = (event.clientX - r.left) / r.width, py = (event.clientY - r.top) / r.height;
    frame = requestAnimationFrame(function () {
      hero.style.setProperty('--am-rx', (py - .5) * -2.4 + 'deg');
      hero.style.setProperty('--am-ry', (px - .5) * 2.4 + 'deg');
      hero.style.setProperty('--am-mx', px * 100 + '%');
      hero.style.setProperty('--am-my', py * 100 + '%');
    });
  });
  hero.addEventListener('pointerleave', clearPointer);
  hero.addEventListener('pointerdown', function (event) {
    if (!playing || reduced.matches) return;
    var field = hero.querySelector('.am-ripple-field');
    var r = hero.getBoundingClientRect();
    var ring = document.createElement('span');
    ring.className = 'am-tap-ring';
    ring.style.left = (event.clientX - r.left) + 'px';
    ring.style.top = (event.clientY - r.top) + 'px';
    field.appendChild(ring);
    setTimeout(function () { ring.remove(); }, 900);
  });
})();
</script>
</body>

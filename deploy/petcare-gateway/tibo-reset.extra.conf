# ---- 额度重置观测台：reset.petcare-home.com ----
#
# 本文件是**观测台自己的**网关配置，由 tibo-reset 项目维护。
# 它**不在 petcare 的 releases/<sha> 树内**，因此 petcare 每次发版都不会覆盖它
# （此前观测台的 server 块是「追加」进 release 里的网关配置，主站一发版就随之消失）。
#
# 生效路径：宿主 /opt/petcare/extra-confs/ →（edge-gateway 只读挂载）
#          容器 /etc/nginx/extra-confs/ → 由 docker/edge-nginx.conf 尾部的
#          `include /etc/nginx/extra-confs/*.conf;` 引入。
#
# 上游是 Docker 网络里的**容器名** tibo-reset（同 petcare_petcare-network），
# 不走宿主机端口 —— 两个容器在同一张网里，用名字直连是最短路径。
# TLS 参数（ssl_protocols / ssl_ciphers / session cache）定义在网关配置文件**顶部**，
# 属于 http 上下文，这里自动继承，不用重复写。
#
# 改完这个文件**不需要重启或重建任何容器**，一条 reload 即可：
#   docker exec petcare-edge-gateway nginx -t && docker exec petcare-edge-gateway nginx -s reload

# ---- HTTP：重定向到 HTTPS ----
# 单独一段，而不去改 petcare 那份 80 块的 server_name：精确 server_name 匹配优先于
# default server，所以这里能独立成立，也就不必再动 release 里的文件。
server {
    listen 80;
    server_name reset.petcare-home.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name reset.petcare-home.com;

    ssl_certificate     /etc/nginx/certs/reset.petcare-home.com_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/reset.petcare-home.com.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 本机自动化每轮采集后 POST /api/ingest，留够余量
    client_max_body_size 10m;

    location / {
        proxy_pass http://tibo-reset:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
